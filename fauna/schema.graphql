type Query {
  validateSession(session_token: String!): SessionToken! @resolver(name: "validateSession")
  getOtpByUser(session_token: String!): [NullableOtp!]! @resolver(name: "getOtpByUser")
}

type Mutation {
  createBatchedOtp(session_token: String, otpBatches: [SaltedUrl!]!): [Otp]
    @resolver(name: "createBatchedOtp")
}

type Otp @embedded {
  id: String!
  saltedUrl: String!
  userId: String!
}

type NullableOtp @embedded {
  id: String
  saltedUrl: String
  userId: String
}

input SaltedUrl {
  saltedUrl: String!
}

type SessionToken @embedded {
  userId: String!
}
