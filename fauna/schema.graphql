type Query {
  otp: otp
  getOtpByUser(session_token: String!): [otp!]! @resolver(name: "getOtpByUser")
}

type Mutation {
  createBatchedOtp(session_token: String, otpBatches: [OtpInput!]!): [otp!]!
    @resolver(name: "createBatchedOtp")
}

type otp {
  id: String
  saltedUrl: String
  userId: String
}

input OtpInput {
  saltedUrl: String
}

type SessionToken @embedded {
  userId: String
}
